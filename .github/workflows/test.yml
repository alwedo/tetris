name: Test

on:
    pull_request:
        paths-ignore:
            - "**/README.md"
            - "**/.gitignore"
            - "doc/**"
            - "bin/**"

jobs:
    Test:
        runs-on: ubuntu-latest

        steps:
            - name: Set up Go
              uses: actions/setup-go@v7
              with:
                  go-version: stable

            - name: Check out code into the Go module directory
              uses: actions/checkout@v7

            - name: Get dependencies
              run: go mod download

            - name: golangci-lint
              uses: golangci/golangci-lint-action@v9.3.0
              with:
                  version: v2.15.0

            - name: Run tests
              run: make test
