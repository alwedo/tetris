version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: tetris
    main: ./cmd/client
    binary: tetris
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X "main.version={{ .Version }} {{ .Os }}/{{ .Arch }}"

archives:
  - id: archive
    format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip
    files:
      - LICENSE*
      - README*
      - CHANGELOG*

checksum:
  name_template: 'checksums.txt'

changelog:
  disable: true

brews:
  - repository:
      owner: alwedo
      name: homebrew-tap
      token: "{{ .Env.GITHUB_TOKEN }}"
    directory: Formula
    homepage: https://github.com/alwedo/tetris
    description: "Play Tetris in your terminal"
    install: |
      bin.install "tetris"
    test: |
      system "#{bin}/tetris", "--version"
